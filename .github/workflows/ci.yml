name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        run: python -m pytest backend/tests

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --fund=false

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Test frontend
        run: npm --prefix frontend test -- --run

      - name: Build frontend
        run: npm --prefix frontend run build

      # docker-compose.yml 은 SECRET_KEY·DATABASE_URL·DOMAIN_NAME 이 없으면 보간에
      # 실패한다. 이는 SECRET-01 의 fail-closed 설계이며 약화하지 않는다. 구성 검증
      # 자체에는 실제 비밀이 필요 없으므로 scripts/gate.sh 와 동일하게 합성값을
      # 주입한다. 이 값들은 어떤 서명·연결에도 쓰이지 않는다.
      - name: Validate Docker Compose configuration
        env:
          SECRET_KEY: synthetic-ci-value-not-a-real-secret-0000000
          DATABASE_URL: sqlite+aiosqlite:///./synthetic-ci.db
          DOMAIN_NAME: ci.invalid
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

      - name: Security source and logging scan
        run: python scripts/security_scan.py
