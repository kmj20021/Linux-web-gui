<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif">
  <style>
    .ink { fill:#16181d; }
    .mut { fill:#63676f; }
    .acc { fill:#9c3d2e; }
    .b   { font-weight:700; }
    .mono{ font-family:'Consolas','D2Coding','Courier New',monospace; }
    .region { fill:none; stroke:#16181d; stroke-width:1.2; }
    .hair { stroke:#d5d8dd; stroke-width:1; }
    .heavy { stroke:#16181d; stroke-width:1.4; }
  </style>

  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16181d"/></marker>
  </defs>

  <rect width="1400" height="780" fill="#ffffff"/>

  <!-- ────────── 사용자 (웹 브라우저) ────────── -->
  <rect x="430" y="24" width="540" height="76" class="region"/>
  <text x="446" y="48" class="ink b" font-size="12.5">사용자 (웹 브라우저)</text>
  <line x1="446" y1="58" x2="954" y2="58" class="heavy"/>
  <line x1="610" y1="66" x2="610" y2="92" class="hair"/>
  <line x1="790" y1="66" x2="790" y2="92" class="hair"/>

  <text x="446" y="84" class="ink b" font-size="11">대시보드</text>
  <text x="626" y="84" class="ink b" font-size="11">AI 리눅스 학습</text>
  <text x="806" y="84" class="ink b" font-size="11">터미널</text>

  <line x1="700" y1="100" x2="700" y2="140" stroke="#16181d" stroke-width="1.2" marker-start="url(#tip)" marker-end="url(#tip)"/>
  <text x="714" y="124" class="mut" font-size="9.5">정적 화면 · <tspan class="mono">/api</tspan> · <tspan class="mono">/ws</tspan></text>

  <!-- ────────── Nginx ────────── -->
  <rect x="430" y="142" width="540" height="58" class="region"/>
  <text x="446" y="166" class="ink b" font-size="12.5">Nginx (리버스 프록시)</text>
  <line x1="446" y1="176" x2="954" y2="176" class="heavy"/>
  <text x="446" y="192" class="mut" font-size="9.5">외부에 열려 있는 유일한 진입점 · TLS 종단</text>

  <line x1="700" y1="200" x2="700" y2="238" stroke="#16181d" stroke-width="1.2" marker-end="url(#tip)"/>

  <!-- ────────── FastAPI Backend ────────── -->
  <rect x="430" y="240" width="540" height="76" class="region"/>
  <text x="446" y="264" class="ink b" font-size="12.5">FastAPI Backend</text>
  <line x1="446" y1="274" x2="954" y2="274" class="heavy"/>
  <line x1="573" y1="282" x2="573" y2="308" class="hair"/>
  <line x1="700" y1="282" x2="700" y2="308" class="hair"/>
  <line x1="827" y1="282" x2="827" y2="308" class="hair"/>

  <text x="446" y="299" class="ink b" font-size="10.5">인증 · 권한</text>
  <text x="589" y="299" class="ink b" font-size="10.5">API 라우터</text>
  <text x="716" y="299" class="ink b" font-size="10.5">메트릭 수집기</text>
  <text x="843" y="299" class="ink b" font-size="10.5">작업 스케줄러</text>

  <!-- 백엔드 → 세 경로 -->
  <path d="M500,316 V336 H180 V354" fill="none" stroke="#16181d" stroke-width="1.2" marker-end="url(#tip)"/>
  <line x1="700" y1="316" x2="700" y2="354" stroke="#16181d" stroke-width="1.2" marker-end="url(#tip)"/>
  <path d="M900,316 V336 H1220 V354" fill="none" stroke="#16181d" stroke-width="1.2" marker-end="url(#tip)"/>

  <!-- ────────── 1 모니터링 경로 ────────── -->
  <rect x="40" y="356" width="280" height="232" class="region"/>
  <text x="56" y="380" class="ink b" font-size="12.5">1 &#160;모니터링 경로</text>
  <text x="56" y="395" class="mut" font-size="9.5">자원 관찰 · 생성형 AI를 거치지 않는다</text>
  <line x1="56" y1="404" x2="304" y2="404" class="heavy"/>

  <text x="56" y="424" class="ink b" font-size="11">실시간 스트림</text>
  <text x="56" y="443" class="mut" font-size="9.5">CPU · 메모리 · 상위 프로세스</text>
  <line x1="56" y1="459" x2="304" y2="459" class="hair"/>

  <text x="56" y="483" class="ink b" font-size="11">이력 저장 · 조회</text>
  <text x="56" y="502" class="mut" font-size="9.5">같은 항목을 주기적으로 저장</text>
  <line x1="56" y1="518" x2="304" y2="518" class="hair"/>

  <text x="56" y="542" class="ink b" font-size="11">스트림 밖 항목</text>
  <text x="56" y="561" class="mut" font-size="9.5">디스크 · 네트워크 (REST 조회)</text>

  <!-- ────────── 2 학습 경로 ────────── -->
  <rect x="350" y="356" width="700" height="232" class="region"/>
  <text x="366" y="380" class="ink b" font-size="12.5">2 &#160;학습 경로 (가상 실습 · 채점 · 설명)</text>
  <text x="366" y="395" class="mut" font-size="9.5">안전한 Linux 실습 · 실제로 실행하지 않는다</text>
  <line x1="366" y1="404" x2="1034" y2="404" class="heavy"/>

  <text x="366" y="456" class="ink b" font-size="12">가상 Linux 상태 엔진</text>
  <text x="366" y="476" class="mut" font-size="10">명령 파싱 · 상태 전이</text>

  <line x1="545" y1="452" x2="577" y2="452" stroke="#16181d" stroke-width="1.2" marker-end="url(#tip)"/>

  <text x="589" y="456" class="ink b" font-size="12">규칙 기반 채점기</text>
  <text x="589" y="476" class="mut" font-size="10">성공 · 부분 성공 · 실패</text>

  <line x1="768" y1="452" x2="800" y2="452" stroke="#16181d" stroke-width="1.2" marker-end="url(#tip)"/>

  <text x="812" y="456" class="acc b" font-size="12">Amazon Bedrock</text>
  <text x="812" y="476" class="mut" font-size="10">설명 · 힌트 (외부 AI)</text>

  <line x1="366" y1="528" x2="1034" y2="528" class="hair"/>
  <text x="366" y="552" class="mut" font-size="9.5">입력한 명령은 실제 서버가 아니라 가상 상태에만 적용된다.</text>

  <!-- ────────── 3 실행 경로 ────────── -->
  <rect x="1080" y="356" width="280" height="232" class="region"/>
  <text x="1096" y="380" class="ink b" font-size="12.5">3 &#160;실행 경로 (웹 터미널)</text>
  <text x="1096" y="395" class="mut" font-size="9.5">격리된 환경에서 실제로 실행한다</text>
  <line x1="1096" y1="404" x2="1344" y2="404" class="heavy"/>

  <text x="1096" y="428" class="ink b" font-size="11">Docker 소켓 프록시</text>
  <text x="1096" y="447" class="mut" font-size="9.5">Docker API 중 컨테이너 · 이미지</text>
  <text x="1096" y="464" class="mut" font-size="9.5">요청만 통과시킨다</text>
  <line x1="1096" y1="482" x2="1344" y2="482" class="hair"/>

  <text x="1096" y="506" class="ink b" font-size="11">격리 컨테이너에서 실제 실행</text>
  <text x="1096" y="526" class="mut" font-size="9.5">네트워크 차단 · 읽기 전용 · 권한 상승 금지</text>
  <text x="1096" y="544" class="mut" font-size="9.5">자원 제한 (CPU · 메모리 · 프로세스 수)</text>

  <!-- 경로 → SQLite -->
  <line x1="180" y1="588" x2="180" y2="626" stroke="#16181d" stroke-width="1.2" marker-end="url(#tip)"/>
  <line x1="700" y1="588" x2="700" y2="626" stroke="#16181d" stroke-width="1.2" marker-end="url(#tip)"/>

  <!-- ────────── SQLite ────────── -->
  <rect x="40" y="628" width="1320" height="64" class="region"/>
  <text x="56" y="652" class="ink b" font-size="12.5">SQLite Database</text>
  <line x1="56" y1="662" x2="1344" y2="662" class="heavy"/>
  <text x="56" y="680" class="mut" font-size="10">8개 테이블 — 사용자 · 로그인 기록 · 모니터링 이력 · 학습 세션 · 가상 상태 · 명령 시도 · 대화 · 상호작용 감사</text>

  <!-- ────────── 주석 ────────── -->
  <line x1="40" y1="716" x2="1360" y2="716" class="heavy"/>
  <text x="40" y="738" class="mut" font-size="9.5">· 자원 수집은 백엔드 프로세스 안에서 수행하며 별도 수집 에이전트는 없다.</text>
  <text x="40" y="756" class="mut" font-size="9.5">· 실행 경로는 데이터베이스에 기록하지 않으며, 학습 경로와 시스템 상태를 공유하지 않는다.</text>
</svg>
