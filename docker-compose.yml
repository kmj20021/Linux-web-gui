volumes:
  letsencrypt: # Let's Encrypt 인증서 저장 볼륨
  certbot: # Certbot 검증용 볼륨

services:
  frontend:
    build:
      context: ./frontend
    platform: linux/amd64
    image: minjegod/linux_gui_frontend:latest
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: always
    volumes:
      - letsencrypt:/etc/letsencrypt # Let's Encrypt 인증서
      - certbot:/var/www/certbot # Certbot 검증 디렉토리
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:?DOMAIN_NAME is required}

  backend:
    build:
      context: ./backend
    image: minjegod/linux_gui_backend:latest
    platform: linux/amd64
    expose:
      - "8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ALGORITHM
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    privileged: false
    volumes:
      - /var/log:/var/log:ro
      - ./data/linux_web_gui.db:/app/linux_web_gui.db
      - /home/webterm:/home/webterm
    depends_on:
      - docker-socket-proxy
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      - PING=1
      - VERSION=1
      - IMAGES=1
      - CONTAINERS=1
      - POST=1
    expose:
      - "2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always

  certbot:
    image: certbot/certbot:latest
    platform: linux/amd64
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot:/var/www/certbot
    # 인자 없이 뜨면(docker compose up) 12시간 주기 renew 루프를 돈다.
    # 인자가 있으면(docker compose run --rm certbot certonly ...) 그 명령을 그대로 certbot에 넘긴다.
    entrypoint: /bin/sh -c 'if [ "$#" -gt 0 ]; then exec certbot "$@"; fi; trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;' --
    restart: always
    depends_on:
      - frontend
